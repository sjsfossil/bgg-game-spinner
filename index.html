<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>BGG Game Night Spinner</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root{
      color-scheme: dark;
      --bg:#0b1020;
      --panel:#151c31;
      --panel2:#1c2540;
      --text:#f8fafc;
      --muted:#a8b3cf;
      --accent:#7c3aed;
      --accent2:#22c55e;
      --danger:#ef4444;
      --line:#2d385a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(180deg,#0b1020,#10172b);
      color:var(--text);
      min-height:100vh;
    }
    .wrap{max-width:760px;margin:auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
    h1{font-size:1.8rem;margin:10px 0 4px}
    .sub{color:var(--muted);margin:0 0 18px}
    .card{
      background:rgba(21,28,49,.96);
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
      margin:14px 0;
      box-shadow:0 12px 30px rgba(0,0,0,.25);
    }
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    button,.file-label{
      appearance:none;border:0;border-radius:14px;padding:13px 16px;
      font-size:1rem;font-weight:700;cursor:pointer;
      background:var(--panel2);color:var(--text);border:1px solid var(--line);
    }
    button.primary{background:var(--accent);border-color:transparent}
    button.play{background:var(--accent2);color:#06120a;border-color:transparent}
    button.pass{background:#374151}
    button.danger{background:#7f1d1d}
    button:disabled{opacity:.45;cursor:not-allowed}
    input[type=file]{display:none}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
    .stat{background:#0f172a;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
    .stat strong{display:block;font-size:1.35rem}
    .stat span{color:var(--muted);font-size:.82rem}
    .wheel-wrap{position:relative;display:grid;place-items:center;margin:8px auto 14px}
    canvas{max-width:100%;height:auto;filter:drop-shadow(0 10px 22px rgba(0,0,0,.35))}
    .pointer{
      position:absolute;top:4px;width:0;height:0;
      border-left:18px solid transparent;border-right:18px solid transparent;
      border-top:32px solid #f8fafc;z-index:3;
      filter:drop-shadow(0 4px 5px rgba(0,0,0,.4));
    }
    .winner{font-size:1.5rem;font-weight:800;text-align:center;margin:8px 0}
    .meta{color:var(--muted);text-align:center;margin-bottom:12px}
    .comments{
      background:#0f172a;border:1px solid var(--line);border-radius:14px;
      padding:14px;white-space:pre-wrap;line-height:1.45;
    }
    .comments.empty{color:var(--muted);font-style:italic}
    .reveal-card{overflow:hidden;padding:0;background:linear-gradient(180deg,#18213a,#111827)}
    .hero{position:relative;min-height:280px;background:#0f172a;display:grid;place-items:center;overflow:hidden}
    .hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,16,32,.05),rgba(11,16,32,.95))}
    .hero img{width:100%;height:340px;object-fit:contain;padding:18px;position:relative;z-index:1}
    .hero img.failed{display:none}
    .art-placeholder{position:absolute;inset:0;display:grid;place-items:center;font-size:5rem;color:var(--muted)}
    .reveal-body{padding:18px}
    .reveal-title{font-size:1.75rem;line-height:1.15;font-weight:900;text-align:center;margin:0 0 6px}
    .reveal-year{text-align:center;color:var(--muted);margin-bottom:16px}
    .detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}
    .detail{background:#0f172a;border:1px solid var(--line);border-radius:14px;padding:11px 7px;text-align:center}
    .detail strong{display:block;font-size:1rem}.detail span{display:block;color:var(--muted);font-size:.75rem;margin-top:3px}
    .section-title{font-weight:800;margin:16px 0 8px}
    .external-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .link-button{display:block;text-decoration:none;text-align:center;border-radius:14px;padding:13px 12px;font-weight:800;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
    .link-button.dized{background:#1e3a5f}.link-button.bgg{background:#713f12}
    .decision-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
    .decision-actions button{width:100%}
    .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999}
    .confetti-piece{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 1.8s linear forwards}
    @keyframes fall{to{transform:translate3d(var(--drift),110vh,rotate(720deg));opacity:.2}}
    .hidden{display:none!important}
    label.check{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.95rem}
    select,input[type=number]{
      width:100%;background:#0f172a;color:var(--text);border:1px solid var(--line);
      border-radius:12px;padding:11px;font-size:1rem;
    }
    .filter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .field{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:.9rem}
    .field span{font-weight:700;color:var(--text)}
    .small{font-size:.88rem;color:var(--muted)}
    .history-item{
      display:flex;justify-content:space-between;gap:8px;padding:9px 0;
      border-bottom:1px solid var(--line)
    }
    .badge{font-size:.75rem;font-weight:700;padding:4px 8px;border-radius:999px;background:#334155}
    .badge.played{background:#14532d}.badge.passed{background:#374151}
    @media (max-width:620px){
      .filter-grid{grid-template-columns:1fr}
      .stats{grid-template-columns:1fr 1fr 1fr}
      button,.file-label{width:100%;text-align:center}
      .row.actions button{width:calc(50% - 5px)}
      .detail-grid{grid-template-columns:1fr 1fr}
      .decision-actions{grid-template-columns:1fr}
      .external-actions{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>🎲 BGG Game Spinner</h1>
    <p class="sub">Choose the group size and available time, then spin for a game from your collection.</p>

    <section class="card">
      <div class="row">
        <label class="file-label" for="csvFile">Import BGG CSV</label>
        <input id="csvFile" type="file" accept=".csv,text/csv" />
        <button id="hostedBtn">Load Hosted Collection</button>
        <button id="reloadBtn">Reload This Device’s Import</button>
      </div>
      <div class="filter-grid" style="margin-top:14px">
        <label class="field">
          <span>Games to include</span>
          <select id="playScope">
            <option value="unplayed" selected>No plays only</option>
            <option value="all">All owned games</option>
          </select>
        </label>
        <label class="field">
          <span>Player count</span>
          <input id="playerCount" type="number" min="1" max="99" inputmode="numeric" placeholder="Any" />
        </label>
        <label class="field">
          <span>Maximum play time</span>
          <select id="maxTime">
            <option value="" selected>Any length</option>
            <option value="30">30 minutes</option>
            <option value="45">45 minutes</option>
            <option value="60">1 hour</option>
            <option value="90">1.5 hours</option>
            <option value="120">2 hours</option>
            <option value="180">3 hours</option>
            <option value="240">4 hours</option>
          </select>
        </label>
      </div>
      <div class="row" style="margin-top:12px">
        <label class="check"><input id="excludeExpansions" type="checkbox" checked> Exclude expansions</label>
        <label class="check"><input id="ownedOnly" type="checkbox" checked> Owned only</label>
        <button id="clearFiltersBtn" type="button">Clear game-night filters</button>
      </div>
      <p id="importMessage" class="small">No collection imported yet.</p>
      <div class="stats">
        <div class="stat"><strong id="totalCount">0</strong><span>Eligible</span></div>
        <div class="stat"><strong id="passedCount">0</strong><span>Passed</span></div>
        <div class="stat"><strong id="playedCount">0</strong><span>Selected</span></div>
      </div>
    </section>

    <section class="card">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="620" height="620"></canvas>
      </div>
      <button id="spinBtn" class="primary" style="width:100%" disabled>SPIN THE WHEEL</button>
    </section>

    <section id="resultCard" class="card reveal-card hidden">
      <div class="hero">
        <div class="art-placeholder">🎲</div>
        <img id="gameArt" alt="Selected game box art" />
      </div>
      <div class="reveal-body">
        <h2 id="winner" class="reveal-title"></h2>
        <div id="gameYear" class="reveal-year"></div>
        <div class="detail-grid">
          <div class="detail"><strong id="playersDetail">—</strong><span>Players</span></div>
          <div class="detail"><strong id="timeDetail">—</strong><span>Play time</span></div>
          <div class="detail"><strong id="weightDetail">—</strong><span>Weight</span></div>
          <div class="detail"><strong id="ratingDetail">—</strong><span>BGG rating</span></div>
        </div>
        <div class="section-title">Your BGG comments</div>
        <div id="comments" class="comments empty"></div>
        <div class="external-actions">
          <a id="bggLink" class="link-button bgg" target="_blank" rel="noopener">View on BGG</a>
          <a id="dizedLink" class="link-button dized" target="_blank" rel="noopener">Search Dized Tutorial</a>
        </div>
        <div class="decision-actions">
          <button id="playBtn" class="play">Play It</button>
          <button id="passBtn" class="pass">Pass</button>
          <button id="spinAgainBtn">Spin Again</button>
        </div>
      </div>
    </section>
    <div id="confetti" class="confetti hidden"></div>

    <section class="card">
      <div class="row" style="justify-content:space-between">
        <strong>Session History</strong>
        <button id="resetBtn" class="danger">Reset Session</button>
      </div>
      <div id="history" class="small" style="margin-top:10px">No decisions yet.</div>
    </section>
  </main>

<script>
const els = {
  file: document.getElementById('csvFile'),
  hosted: document.getElementById('hostedBtn'),
  reload: document.getElementById('reloadBtn'),
  excludeExpansions: document.getElementById('excludeExpansions'),
  ownedOnly: document.getElementById('ownedOnly'),
  playScope: document.getElementById('playScope'),
  playerCount: document.getElementById('playerCount'),
  maxTime: document.getElementById('maxTime'),
  clearFilters: document.getElementById('clearFiltersBtn'),
  importMessage: document.getElementById('importMessage'),
  totalCount: document.getElementById('totalCount'),
  passedCount: document.getElementById('passedCount'),
  playedCount: document.getElementById('playedCount'),
  spin: document.getElementById('spinBtn'),
  canvas: document.getElementById('wheel'),
  resultCard: document.getElementById('resultCard'),
  winner: document.getElementById('winner'),
  gameYear: document.getElementById('gameYear'),
  gameArt: document.getElementById('gameArt'),
  playersDetail: document.getElementById('playersDetail'),
  timeDetail: document.getElementById('timeDetail'),
  weightDetail: document.getElementById('weightDetail'),
  ratingDetail: document.getElementById('ratingDetail'),
  bggLink: document.getElementById('bggLink'),
  dizedLink: document.getElementById('dizedLink'),
  spinAgain: document.getElementById('spinAgainBtn'),
  confetti: document.getElementById('confetti'),
  comments: document.getElementById('comments'),
  play: document.getElementById('playBtn'),
  pass: document.getElementById('passBtn'),
  reset: document.getElementById('resetBtn'),
  history: document.getElementById('history')
};

const ctx = els.canvas.getContext('2d');
let allGames = [];
let eligibleGames = [];
let currentGame = null;
let rotation = 0;
let spinning = false;
let decisions = JSON.parse(localStorage.getItem('bgg-spinner-decisions') || '{}');

function normalizeHeader(h){
  return String(h || '').trim().toLowerCase().replace(/[^a-z0-9]/g,'');
}
function firstValue(row, names){
  for (const name of names){
    const key = Object.keys(row).find(k => normalizeHeader(k) === normalizeHeader(name));
    if (key && row[key] !== undefined) return String(row[key]).trim();
  }
  return '';
}
function toNumber(v){
  const n = Number(String(v).replace(/,/g,'').trim());
  return Number.isFinite(n) ? n : 0;
}
function parseCSV(text){
  const rows=[]; let row=[], field='', quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], next=text[i+1];
    if(c === '"'){
      if(quoted && next === '"'){ field+='"'; i++; }
      else quoted=!quoted;
    } else if(c === ',' && !quoted){ row.push(field); field=''; }
    else if((c === '\n' || c === '\r') && !quoted){
      if(c === '\r' && next === '\n') i++;
      row.push(field); field='';
      if(row.some(v => v !== '')) rows.push(row);
      row=[];
    } else field+=c;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(rows.length < 2) return [];
  const headers=rows[0].map(h=>h.trim());
  return rows.slice(1).map(values=>{
    const obj={}; headers.forEach((h,i)=>obj[h]=values[i] ?? ''); return obj;
  });
}
function mapGame(row, index){
  return {
    id: firstValue(row,['objectid','object id','gameid','game id']) || `row-${index}`,
    name: firstValue(row,['objectname','name','title','game']),
    own: toNumber(firstValue(row,['own','owned'])),
    numplays: toNumber(firstValue(row,['numplays','num plays','plays'])),
    subtype: firstValue(row,['itemtype','subtype','type']).toLowerCase(),
    comment: [firstValue(row,['comment','comments','usercomment','user comment','notes']), firstValue(row,['privatecomment','private comment'])].filter(Boolean).join('\n\n'),
    year: firstValue(row,['yearpublished','year published','year']),
    minplayers: toNumber(firstValue(row,['minplayers','min players'])),
    maxplayers: toNumber(firstValue(row,['maxplayers','max players'])),
    playingtime: toNumber(firstValue(row,['playingtime','playing time','playtime'])),
    minplaytime: toNumber(firstValue(row,['minplaytime','min play time'])),
    maxplaytime: toNumber(firstValue(row,['maxplaytime','max play time'])),
    weight: firstValue(row,['avgweight','weight','average weight']),
    rating: firstValue(row,['average','baverage','rating','bgg rating']),
    imageid: firstValue(row,['imageid','image id']),
    raw: row
  };
}
function applyFilters(){
  eligibleGames = allGames.filter(g => {
    if(!g.name) return false;
    if(els.ownedOnly.checked && g.own !== 1) return false;
    if(els.playScope.value === 'unplayed' && g.numplays !== 0) return false;
    if(els.excludeExpansions.checked && (g.subtype.includes('expansion') || (g.subtype && g.subtype !== 'standalone'))) return false;

    const requestedPlayers = toNumber(els.playerCount.value);
    if(requestedPlayers > 0){
      if(g.minplayers <= 0 || g.maxplayers <= 0) return false;
      if(requestedPlayers < g.minplayers || requestedPlayers > g.maxplayers) return false;
    }

    const maximumMinutes = toNumber(els.maxTime.value);
    if(maximumMinutes > 0){
      if(g.playingtime <= 0 || g.playingtime > maximumMinutes) return false;
    }

    if(decisions[g.id]) return false;
    return true;
  });
  currentGame=null;
  els.resultCard.classList.add('hidden');
  els.spin.disabled = eligibleGames.length === 0;
  updateStats();
  drawWheel();
}
function updateStats(){
  const values = Object.values(decisions);
  els.totalCount.textContent = eligibleGames.length;
  els.passedCount.textContent = values.filter(v=>v.status==='passed').length;
  els.playedCount.textContent = values.filter(v=>v.status==='played').length;
  renderHistory();
}
function colorFor(i,total){
  const hue = Math.round((i * 360 / Math.max(total,1)) % 360);
  return `hsl(${hue} 65% 48%)`;
}
function drawWheel(){
  const w=els.canvas.width,h=els.canvas.height,cx=w/2,cy=h/2,r=Math.min(w,h)/2-18;
  ctx.clearRect(0,0,w,h);
  if(!eligibleGames.length){
    ctx.fillStyle='#1f2937';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#cbd5e1';ctx.font='700 28px -apple-system, sans-serif';ctx.textAlign='center';
    ctx.fillText(allGames.length ? 'No games match filters' : 'Import your BGG CSV',cx,cy);
    return;
  }
  const shown = eligibleGames.slice(0,80);
  const arc=Math.PI*2/shown.length;
  shown.forEach((g,i)=>{
    const start=rotation+i*arc,end=start+arc;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,end);ctx.closePath();
    ctx.fillStyle=colorFor(i,shown.length);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(start+arc/2);
    ctx.textAlign='right';ctx.fillStyle='#fff';
    const fs = shown.length > 40 ? 11 : shown.length > 20 ? 14 : 18;
    ctx.font=`700 ${fs}px -apple-system, sans-serif`;
    const maxChars = shown.length > 40 ? 18 : shown.length > 20 ? 24 : 32;
    const label=g.name.length>maxChars?g.name.slice(0,maxChars-1)+'…':g.name;
    ctx.fillText(label,r-18,fs/3);ctx.restore();
  });
  ctx.beginPath();ctx.arc(cx,cy,42,0,Math.PI*2);ctx.fillStyle='#111827';ctx.fill();
  ctx.strokeStyle='#f8fafc';ctx.lineWidth=4;ctx.stroke();
}
function spinWheel(){
  if(spinning || !eligibleGames.length) return;
  spinning=true;els.spin.disabled=true;
  const chosenIndex=Math.floor(Math.random()*eligibleGames.length);
  const shown=eligibleGames.slice(0,80);
  const displayIndex=Math.min(chosenIndex,shown.length-1);
  const arc=Math.PI*2/shown.length;
  const pointerAngle=-Math.PI/2;
  const target=pointerAngle-(displayIndex+.5)*arc;
  const extraTurns=(5+Math.random()*3)*Math.PI*2;
  const start=rotation;
  const end=target+extraTurns;
  const duration=3200;
  const t0=performance.now();
  function animate(now){
    const p=Math.min((now-t0)/duration,1);
    const eased=1-Math.pow(1-p,4);
    rotation=start+(end-start)*eased;
    drawWheel();
    if(p<1) requestAnimationFrame(animate);
    else{
      rotation=((rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      currentGame=eligibleGames[chosenIndex];
      showResult(currentGame);
      spinning=false;els.spin.disabled=false;
    }
  }
  requestAnimationFrame(animate);
}
function formatNumber(value, digits=1){
  const n=Number(value);
  return Number.isFinite(n) && n>0 ? n.toFixed(digits) : '—';
}
function launchConfetti(){
  els.confetti.innerHTML='';
  els.confetti.classList.remove('hidden');
  const colors=['#f59e0b','#22c55e','#7c3aed','#38bdf8','#f43f5e','#f8fafc'];
  for(let i=0;i<70;i++){
    const piece=document.createElement('div');
    piece.className='confetti-piece';
    piece.style.left=`${Math.random()*100}%`;
    piece.style.background=colors[i%colors.length];
    piece.style.setProperty('--drift',`${(Math.random()-.5)*240}px`);
    piece.style.animationDelay=`${Math.random()*.45}s`;
    piece.style.transform=`rotate(${Math.random()*360}deg)`;
    els.confetti.appendChild(piece);
  }
  setTimeout(()=>els.confetti.classList.add('hidden'),2400);
}
function showResult(g){
  els.winner.textContent=g.name;
  els.gameYear.textContent=g.year ? `Published ${g.year}` : '';
  els.playersDetail.textContent=(g.minplayers||g.maxplayers) ? `${g.minplayers||'?'}–${g.maxplayers||'?'}` : '—';
  const minTime=g.minplaytime||g.playingtime;
  const maxTime=g.maxplaytime||g.playingtime;
  els.timeDetail.textContent=minTime ? (maxTime && maxTime!==minTime ? `${minTime}–${maxTime} min` : `${minTime} min`) : '—';
  els.weightDetail.textContent=formatNumber(g.weight,1);
  els.ratingDetail.textContent=formatNumber(g.rating,1);
  els.comments.textContent=g.comment || 'No BGG comments were included for this game.';
  els.comments.classList.toggle('empty',!g.comment);
  els.bggLink.href=`https://boardgamegeek.com/boardgame/${encodeURIComponent(g.id)}`;
  els.dizedLink.href=`https://dized.com/search/?q=${encodeURIComponent(g.name)}`;
  els.gameArt.classList.remove('failed');
  els.gameArt.alt=`${g.name} box art`;
  if(g.imageid){
    els.gameArt.src=`https://cf.geekdo-static.com/images/pic${encodeURIComponent(g.imageid)}.jpg`;
  }else{
    els.gameArt.removeAttribute('src');
    els.gameArt.classList.add('failed');
  }
  els.gameArt.onerror=()=>els.gameArt.classList.add('failed');
  els.resultCard.classList.remove('hidden');
  launchConfetti();
  els.resultCard.scrollIntoView({behavior:'smooth',block:'start'});
}
function decide(status){
  if(!currentGame) return;
  decisions[currentGame.id]={status,name:currentGame.name,at:new Date().toISOString()};
  localStorage.setItem('bgg-spinner-decisions',JSON.stringify(decisions));
  applyFilters();
}
function renderHistory(){
  const items=Object.values(decisions).sort((a,b)=>b.at.localeCompare(a.at));
  if(!items.length){els.history.textContent='No decisions yet.';return;}
  els.history.innerHTML=items.map(i=>`
    <div class="history-item">
      <span>${escapeHtml(i.name)}</span>
      <span class="badge ${i.status}">${i.status==='played'?'PLAY':'PASS'}</span>
    </div>`).join('');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function loadText(text, remember=true, sourceLabel='collection'){
  const rows=parseCSV(text);
  allGames=rows.map(mapGame).filter(g=>g.name);
  if(remember){
    try{localStorage.setItem('bgg-spinner-last-csv',text)}catch(e){}
  }
  els.importMessage.textContent=`Loaded ${allGames.length} rows from ${sourceLabel}.`;
  applyFilters();
}
els.file.addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file) return;
  loadText(await file.text(),true,'your uploaded CSV');
});
async function loadHostedCollection(){
  els.importMessage.textContent='Loading the hosted collection…';
  try{
    const response=await fetch('./collection.csv',{cache:'no-store'});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    loadText(await response.text(),false,'the hosted collection');
  }catch(error){
    els.importMessage.textContent='Could not load collection.csv from the hosted site. You can still import a CSV manually.';
  }
}
els.hosted.addEventListener('click',loadHostedCollection);
els.reload.addEventListener('click',()=>{
  const text=localStorage.getItem('bgg-spinner-last-csv');
  if(text) loadText(text,false,'this device’s saved CSV');
  else els.importMessage.textContent='No saved import was found on this device.';
});
[els.excludeExpansions,els.ownedOnly,els.playScope,els.maxTime].forEach(el=>el.addEventListener('change',applyFilters));
els.playerCount.addEventListener('input',applyFilters);
els.clearFilters.addEventListener('click',()=>{
  els.playScope.value='unplayed';
  els.playerCount.value='';
  els.maxTime.value='';
  applyFilters();
});
els.spin.addEventListener('click',spinWheel);
els.play.addEventListener('click',()=>decide('played'));
els.pass.addEventListener('click',()=>decide('passed'));
els.spinAgain.addEventListener('click',()=>{ els.resultCard.classList.add('hidden'); spinWheel(); });
els.reset.addEventListener('click',()=>{
  decisions={};localStorage.removeItem('bgg-spinner-decisions');applyFilters();
});
drawWheel();updateStats();
loadHostedCollection();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=5').catch(()=>{}));
}
</script>
</body>
</html>
